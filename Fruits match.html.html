<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍓 Fruit Match 🍎</title>
<style>
  :root{
    --bg-deep:#2a1b3d;
    --bg-mid:#7a2e5c;
    --bg-warm:#ff7b54;
    --card:#fff8ed;
    --card-edge:#ffe9c7;
    --ink:#3a2145;
    --ink-soft:#7a5c8a;
    --leaf:#3fae5a;
    --leaf-dark:#2c8a45;
    --sun:#ffc93c;
    --sun-dark:#f2a900;
    --berry:#e8437b;
    --berry-dark:#c72c60;
    --tile:#fff3e0;
    --tile-edge:#ffd9a6;
    --shadow: 0 10px 30px rgba(42,27,61,0.35);
    font-family: "Baloo 2","Comic Sans MS", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,201,60,0.25), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(232,67,123,0.35), transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-warm) 100%);
    background-attachment: fixed;
    padding: 16px;
    color: var(--ink);
    user-select:none;
  }

  /* floating ambient fruit blobs behind the card */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .ambient span{
    position:absolute; font-size:38px; opacity:0.14; filter: blur(0.3px);
    animation: drift 18s linear infinite;
  }
  @keyframes drift{
    0%{ transform: translateY(110vh) rotate(0deg); }
    100%{ transform: translateY(-15vh) rotate(360deg); }
  }

  .app{
    position:relative; z-index:1;
    width:100%;
    max-width: 480px;
  }

  .card{
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 18px 18px 22px;
    position:relative;
  }

  .title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 10px;
  }

  h1{
    margin:0;
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--berry-dark);
    text-shadow: 2px 2px 0 var(--sun);
    line-height:1.1;
  }

  .sound-btn{
    border:none;
    background: var(--tile);
    border: 2px solid var(--tile-edge);
    width:42px; height:42px;
    border-radius: 14px;
    font-size:20px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .sound-btn:active{ transform: scale(0.9); }
  .sound-btn.muted{ background:#f0e4e4; color:#a88; }

  .stats-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat{
    background: linear-gradient(160deg, var(--tile), #ffe6c2);
    border: 2px solid var(--tile-edge);
    border-radius: 16px;
    padding: 8px 6px;
    text-align:center;
    position:relative;
    overflow:visible;
  }

  .stat .label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    font-weight:700;
  }

  .stat .value{
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
    line-height:1.3;
  }

  .stat.score .value{ color: var(--berry-dark); }
  .stat.moves .value{ color: var(--leaf-dark); }
  .stat.best .value{ color: var(--sun-dark); }

  .moves.low .value{ color:#d33; animation: pulseWarn 0.9s infinite; }
  @keyframes pulseWarn{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }

  .popup-layer{
    position:absolute; inset:0; pointer-events:none; z-index:5;
  }

  .float-pop{
    position:absolute;
    font-weight:800;
    font-size: 20px;
    color: var(--berry-dark);
    text-shadow: 1px 1px 0 #fff;
    animation: floatUp 0.9s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) scale(0.6); opacity:0; }
    15%{ opacity:1; transform: translateY(-4px) scale(1.15); }
    100%{ transform: translateY(-46px) scale(1); opacity:0; }
  }

  .combo-banner{
    position:absolute;
    top: 40%;
    left:50%;
    transform: translate(-50%,-50%) scale(0.4);
    font-size: 30px;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(120deg, var(--berry), var(--sun-dark));
    padding: 8px 22px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    opacity:0;
    z-index: 20;
    white-space:nowrap;
    animation: comboPop 0.85s ease forwards;
  }
  @keyframes comboPop{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(0.3) rotate(-8deg); }
    25%{ opacity:1; transform: translate(-50%,-50%) scale(1.15) rotate(3deg); }
    45%{ transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    80%{ opacity:1; }
    100%{ opacity:0; transform: translate(-50%,-50%) scale(1) translateY(-20px); }
  }

  .board-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 1/1;
    background: linear-gradient(160deg, #ffe2b0, #ffcf8e);
    border-radius: 20px;
    border: 3px solid var(--tile-edge);
    padding: 6px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.08);
  }

  #board{
    position:relative;
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 2%;
  }

  .cell{
    position:relative;
    border-radius: 12px;
    background: rgba(255,255,255,0.35);
  }

  .fruit{
    position:absolute;
    inset: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: min(6.6vw, 32px);
    border-radius: 12px;
    cursor:pointer;
    transition: transform 0.18s ease, top 0.28s cubic-bezier(.5,-0.2,.5,1.2), left 0.18s ease;
    will-change: transform, top, left;
    z-index: 2;
  }

  .fruit.selected{
    transform: scale(1.18);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.9));
    z-index: 4;
  }

  .fruit.spawn{
    animation: dropIn 0.35s ease-out;
  }
  @keyframes dropIn{
    0%{ transform: translateY(-140%) scale(0.7); opacity:0; }
    70%{ opacity:1; }
    100%{ transform: translateY(0) scale(1); opacity:1; }
  }

  .fruit.crushing{
    animation: crush 0.32s ease-in forwards;
    z-index: 3;
    pointer-events:none;
  }
  @keyframes crush{
    0%{ transform: scale(1) rotate(0deg); opacity:1; }
    40%{ transform: scale(1.35) rotate(10deg); opacity:1; }
    100%{ transform: scale(0) rotate(35deg); opacity:0; }
  }

  .fruit.invalid-shake{
    animation: shake 0.35s ease;
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }

  .droplet{
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    pointer-events:none;
    z-index:6;
    animation: splash 0.55s ease-out forwards;
  }
  @keyframes splash{
    0%{ transform: translate(0,0) scale(1); opacity:1; }
    100%{ transform: translate(var(--dx), var(--dy)) scale(0.2); opacity:0; }
  }

  .restart-btn{
    margin-top: 14px;
    width:100%;
    padding: 12px;
    border:none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--leaf), var(--leaf-dark));
    color:#fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor:pointer;
    box-shadow: 0 6px 0 var(--leaf-dark), 0 10px 18px rgba(0,0,0,0.25);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .restart-btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--leaf-dark), 0 4px 10px rgba(0,0,0,0.2);
  }

  .overlay{
    position:absolute; inset:0;
    background: rgba(42,27,61,0.72);
    backdrop-filter: blur(3px);
    border-radius: 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 30;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .overlay-card{
    background: var(--card);
    border-radius: 22px;
    padding: 28px 26px;
    text-align:center;
    width: 82%;
    max-width: 320px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    transform: scale(0.8) translateY(10px);
    transition: transform 0.3s ease;
  }
  .overlay.show .overlay-card{ transform: scale(1) translateY(0); }

  .overlay-card h2{
    margin: 0 0 6px;
    color: var(--berry-dark);
    font-size: 26px;
  }
  .overlay-card p{
    margin: 4px 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .overlay-card .final-score{
    font-size: 40px;
    font-weight: 900;
    color: var(--sun-dark);
    margin: 10px 0 2px;
    text-shadow: 1px 1px 0 var(--berry);
  }
  .new-best{
    display:inline-block;
    margin-top: 6px;
    background: var(--berry);
    color:#fff;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight:800;
    letter-spacing: 0.5px;
  }

  footer{
    text-align:center;
    margin-top: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.3px;
  }

  @media (max-width: 380px){
    h1{ font-size: 21px; }
    .stat .value{ font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div class="app">
  <div class="card" id="card">
    <div class="title-row">
      <h1>🍓 FRUIT MATCH 🍎</h1>
      <button class="sound-btn" id="soundBtn" title="Toggle sound">🔊</button>
    </div>

    <div class="stats-row">
      <div class="stat score">
        <div class="label">Score</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="stat moves" id="movesStat">
        <div class="label">Moves</div>
        <div class="value" id="movesVal">30</div>
      </div>
      <div class="stat best">
        <div class="label">Best</div>
        <div class="value" id="bestVal">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board"></div>
      <div class="popup-layer" id="popupLayer"></div>

      <div class="overlay" id="gameOverOverlay">
        <div class="overlay-card">
          <h2>Game Over!</h2>
          <p>You ran out of moves.</p>
          <div class="final-score" id="finalScoreVal">0</div>
          <p id="bestRow">Best Score: <strong id="finalBestVal">0</strong></p>
          <div id="newBestBadge" style="display:none;" class="new-best">🎉 New Best!</div>
        </div>
      </div>
    </div>

    <button class="restart-btn" id="restartBtn">🔄 Restart Game</button>
  </div>
  <footer>Swap adjacent fruits &middot; match 3 or more &middot; chain combos for bonus points</footer>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIG
  ============================================================ */
  const GRID_SIZE = 8;
  const START_MOVES = 30;
  const FRUITS = ["🍎","🍓","🍌","🍊","🍇","🍉"];
  const FRUIT_COLORS = { // used for juice-splash droplet colors
    "🍎":"#e63946", "🍓":"#e8437b", "🍌":"#ffd23f",
    "🍊":"#ff9f1c", "🍇":"#8e5bd6", "🍉":"#ff5c7a"
  };

  // NOTE ON BEST SCORE STORAGE:
  // This game keeps the "Best Score" in memory only (a JS variable),
  // NOT in localStorage. Browser storage APIs are unreliable / blocked
  // inside the Claude.ai artifact preview sandbox, so persisting there
  // would silently fail. If you save this HTML file to your own computer
  // and open it directly in a normal browser tab, you can swap the
  // `MemoryStore` object below for real `localStorage` calls and the
  // best score will then persist across visits.
  const MemoryStore = (function(){
    let store = { fruitMatchBest: 0 };
    return {
      get(key){ return store[key]; },
      set(key, val){ store[key] = val; }
    };
  })();

  /* ============================================================
     STATE
  ============================================================ */
  let board = [];          // 2D array [row][col] -> fruit emoji or null
  let score = 0;
  let moves = START_MOVES;
  let best = MemoryStore.get('fruitMatchBest') || 0;
  let selected = null;     // {row,col}
  let busy = false;        // true while animations/cascade are resolving
  let soundOn = true;

  /* ============================================================
     DOM REFS
  ============================================================ */
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('scoreVal');
  const movesEl = document.getElementById('movesVal');
  const movesStatEl = document.getElementById('movesStat');
  const bestEl = document.getElementById('bestVal');
  const popupLayer = document.getElementById('popupLayer');
  const overlay = document.getElementById('gameOverOverlay');
  const finalScoreEl = document.getElementById('finalScoreVal');
  const finalBestEl = document.getElementById('finalBestVal');
  const newBestBadge = document.getElementById('newBestBadge');
  const restartBtn = document.getElementById('restartBtn');
  const soundBtn = document.getElementById('soundBtn');
  const cardEl = document.getElementById('card');

  /* ============================================================
     AMBIENT BACKGROUND DECORATION
  ============================================================ */
  function buildAmbient(){
    const ambient = document.getElementById('ambient');
    const chosen = ["🍎","🍓","🍌","🍊","🍇","🍉"];
    for(let i=0;i<10;i++){
      const s = document.createElement('span');
      s.textContent = chosen[i % chosen.length];
      s.style.left = (Math.random()*100)+'vw';
      s.style.animationDuration = (14 + Math.random()*14)+'s';
      s.style.animationDelay = (-Math.random()*18)+'s';
      s.style.fontSize = (24 + Math.random()*30)+'px';
      ambient.appendChild(s);
    }
  }

  /* ============================================================
     WEB AUDIO (no external files)
  ============================================================ */
  let audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }
  function beep(freq, duration, type, gainVal, delay){
    if(!soundOn) return;
    try{
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const startAt = ctx.currentTime + (delay||0);
      gain.gain.setValueAtTime(0, startAt);
      gain.gain.linearRampToValueAtTime(gainVal||0.15, startAt + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + duration + 0.02);
    }catch(e){ /* audio not available, fail silently */ }
  }
  function sfxSwap(){ beep(420, 0.1, 'triangle', 0.12); }
  function sfxInvalid(){ beep(160, 0.15, 'sawtooth', 0.1); }
  function sfxMatch(comboIndex){
    const base = 500 + comboIndex*90;
    beep(base, 0.14, 'sine', 0.16);
    beep(base*1.5, 0.12, 'sine', 0.08, 0.03);
  }
  function sfxCombo(){
    [0,1,2].forEach((i)=> beep(600 + i*160, 0.14, 'square', 0.12, i*0.08));
  }
  function sfxGameOver(){
    [440,370,300,220].forEach((f,i)=> beep(f, 0.28, 'triangle', 0.13, i*0.14));
  }

  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.classList.toggle('muted', !soundOn);
  });

  /* ============================================================
     BOARD CREATION
  ============================================================ */
  function randomFruit(){
    return FRUITS[Math.floor(Math.random()*FRUITS.length)];
  }

  // Create a board guaranteed to have no pre-existing matches.
  function createBoard(){
    const b = [];
    for(let r=0;r<GRID_SIZE;r++){
      const row = [];
      for(let c=0;c<GRID_SIZE;c++){
        let choice;
        do{
          choice = randomFruit();
        } while(
          (c>=2 && row[c-1]===choice && row[c-2]===choice) ||
          (r>=2 && b[r-1][c]===choice && b[r-2][c]===choice)
        );
        row.push(choice);
      }
      b.push(row);
    }
    return b;
  }

  /* ============================================================
     RENDERING
  ============================================================ */
  // cellEls[row][col] -> DOM element (the .fruit div)
  let cellEls = [];

  function buildCellsDOM(){
    boardEl.innerHTML = '';
    cellEls = [];
    for(let r=0;r<GRID_SIZE;r++){
      const rowEls = [];
      for(let c=0;c<GRID_SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        boardEl.appendChild(cell);
        rowEls.push(null);
      }
      cellEls.push(rowEls);
    }
    // now overlay fruit divs positioned absolutely across the whole board
    for(let r=0;r<GRID_SIZE;r++){
      for(let c=0;c<GRID_SIZE;c++){
        const f = document.createElement('div');
        f.className = 'fruit';
        f.textContent = board[r][c];
        positionFruit(f, r, c);
        f.dataset.row = r;
        f.dataset.col = c;
        f.addEventListener('click', onFruitClick);
        f.addEventListener('touchstart', onFruitTouch, {passive:true});
        boardEl.appendChild(f);
        cellEls[r][c] = f;
      }
    }
  }

  function positionFruit(el, r, c){
    const pct = 100/GRID_SIZE;
    el.style.top = (r*pct) + '%';
    el.style.left = (c*pct) + '%';
    el.style.width = pct + '%';
    el.style.height = pct + '%';
  }

  /* ============================================================
     INTERACTION
  ============================================================ */
  let touchStartCell = null;

  function onFruitClick(e){
    handleSelect(parseInt(e.currentTarget.dataset.row), parseInt(e.currentTarget.dataset.col));
  }
  function onFruitTouch(e){
    handleSelect(parseInt(e.currentTarget.dataset.row), parseInt(e.currentTarget.dataset.col));
  }

  function handleSelect(r,c){
    if(busy || moves<=0) return;

    if(!selected){
      selected = {row:r, col:c};
      cellEls[r][c].classList.add('selected');
      return;
    }

    // clicking the same tile again -> deselect
    if(selected.row===r && selected.col===c){
      cellEls[r][c].classList.remove('selected');
      selected = null;
      return;
    }

    const isAdjacent = (Math.abs(selected.row-r) + Math.abs(selected.col-c)) === 1;

    if(!isAdjacent){
      // move selection to the new tile instead
      cellEls[selected.row][selected.col].classList.remove('selected');
      selected = {row:r, col:c};
      cellEls[r][c].classList.add('selected');
      return;
    }

    // valid adjacency -> attempt swap
    const from = selected;
    const to = {row:r, col:c};
    cellEls[from.row][from.col].classList.remove('selected');
    selected = null;
    attemptSwap(from, to);
  }

  /* ============================================================
     SWAPPING
  ============================================================ */
  function swapData(a, b){
    const tmp = board[a.row][a.col];
    board[a.row][a.col] = board[b.row][b.col];
    board[b.row][b.col] = tmp;
  }

  function swapVisual(a, b, callback){
    const elA = cellEls[a.row][a.col];
    const elB = cellEls[b.row][b.col];
    positionFruit(elA, b.row, b.col);
    positionFruit(elB, a.row, a.col);
    // swap references in cellEls to match new logical position
    cellEls[a.row][a.col] = elB;
    cellEls[b.row][b.col] = elA;
    elA.dataset.row = b.row; elA.dataset.col = b.col;
    elB.dataset.row = a.row; elB.dataset.col = a.col;
    setTimeout(callback, 190);
  }

  function attemptSwap(a, b){
    busy = true;
    sfxSwap();
    swapData(a,b);
    swapVisual(a,b, ()=>{
      const matches = findAllMatches();
      if(matches.size===0){
        // no match -> swap back
        swapData(a,b);
        swapVisual(b,a, ()=>{
          cellEls[a.row][a.col].classList.add('invalid-shake');
          cellEls[b.row][b.col].classList.add('invalid-shake');
          sfxInvalid();
          setTimeout(()=>{
            cellEls[a.row][a.col].classList.remove('invalid-shake');
            cellEls[b.row][b.col].classList.remove('invalid-shake');
            busy = false;
          }, 350);
        });
      } else {
        useMove();
        resolveMatches(0);
      }
    });
  }

  /* ============================================================
     MATCH DETECTION
  ============================================================ */
  // Returns a Set of "r,c" strings for every matched cell on the current board
  function findAllMatches(){
    const matched = new Set();

    // horizontal runs
    for(let r=0;r<GRID_SIZE;r++){
      let runStart = 0;
      for(let c=1;c<=GRID_SIZE;c++){
        const prev = board[r][c-1];
        const cur = c<GRID_SIZE ? board[r][c] : null;
        if(cur !== prev){
          const runLen = c - runStart;
          if(runLen>=3){
            for(let k=runStart;k<c;k++) matched.add(r+','+k);
          }
          runStart = c;
        }
      }
    }

    // vertical runs
    for(let c=0;c<GRID_SIZE;c++){
      let runStart = 0;
      for(let r=1;r<=GRID_SIZE;r++){
        const prev = board[r-1][c];
        const cur = r<GRID_SIZE ? board[r][c] : null;
        if(cur !== prev){
          const runLen = r - runStart;
          if(runLen>=3){
            for(let k=runStart;k<r;k++) matched.add(k+','+c);
          }
          runStart = r;
        }
      }
    }

    return matched;
  }

  function pointsForRunLength(len){
    if(len<=3) return 30;
    if(len===4) return 50;
    if(len===5) return 80;
    return 80 + (len-5)*40; // scale up for very large runs
  }

  // Compute score for this pass by re-deriving individual runs (so we can
  // credit points per-run rather than per-cell, matching the point table).
  function scoreForMatches(){
    let total = 0;
    // horizontal
    for(let r=0;r<GRID_SIZE;r++){
      let runStart = 0;
      for(let c=1;c<=GRID_SIZE;c++){
        const prev = board[r][c-1];
        const cur = c<GRID_SIZE ? board[r][c] : null;
        if(cur !== prev){
          const runLen = c - runStart;
          if(runLen>=3) total += pointsForRunLength(runLen);
          runStart = c;
        }
      }
    }
    // vertical
    for(let c=0;c<GRID_SIZE;c++){
      let runStart = 0;
      for(let r=1;r<=GRID_SIZE;r++){
        const prev = board[r-1][c];
        const cur = r<GRID_SIZE ? board[r][c] : null;
        if(cur !== prev){
          const runLen = r - runStart;
          if(runLen>=3) total += pointsForRunLength(runLen);
          runStart = r;
        }
      }
    }
    return total;
  }

  /* ============================================================
     CASCADE RESOLUTION: crush -> fall -> refill -> re-check
  ============================================================ */
  function resolveMatches(comboIndex){
    const matched = findAllMatches();
    if(matched.size===0){
      busy = false;
      checkNoMovesLeft();
      return;
    }

    const gainedPoints = scoreForMatches();
    const finalPoints = comboIndex>0 ? Math.round(gainedPoints * (1 + comboIndex*0.5)) : gainedPoints;

    // visual: crush animation + juice droplets + floating score
    let cx=0, cy=0, count=0;
    matched.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      const el = cellEls[r][c];
      el.classList.add('crushing');
      spawnDroplets(el, board[r][c]);
      const rect = el.getBoundingClientRect();
      const boardRect = boardEl.getBoundingClientRect();
      cx += (rect.left - boardRect.left + rect.width/2);
      cy += (rect.top - boardRect.top + rect.height/2);
      count++;
    });
    if(count>0){ cx/=count; cy/=count; }

    addScore(finalPoints);
    showFloatingScore(cx, cy, finalPoints);
    sfxMatch(comboIndex);
    if(comboIndex>0){
      showComboBanner(comboIndex+1);
      sfxCombo();
    }

    setTimeout(()=>{
      // clear matched cells from data model
      matched.forEach(key=>{
        const [r,c] = key.split(',').map(Number);
        board[r][c] = null;
      });
      applyGravityAndRefill();
      resolveMatches(comboIndex+1);
    }, 300);
  }

  function spawnDroplets(el, fruitEmoji){
    const color = FRUIT_COLORS[fruitEmoji] || '#ff6b9d';
    const rect = el.getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    const x = rect.left - boardRect.left + rect.width/2;
    const y = rect.top - boardRect.top + rect.height/2;
    for(let i=0;i<5;i++){
      const d = document.createElement('div');
      d.className = 'droplet';
      const angle = Math.random()*Math.PI*2;
      const dist = 18 + Math.random()*22;
      d.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
      d.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
      d.style.left = x+'px';
      d.style.top = y+'px';
      d.style.background = color;
      boardEl.appendChild(d);
      setTimeout(()=> d.remove(), 600);
    }
  }

  function showFloatingScore(x, y, points){
    const pop = document.createElement('div');
    pop.className = 'float-pop';
    pop.textContent = '+' + points;
    pop.style.left = x+'px';
    pop.style.top = y+'px';
    popupLayer.appendChild(pop);
    setTimeout(()=> pop.remove(), 950);
  }

  function showComboBanner(comboNumber){
    const banner = document.createElement('div');
    banner.className = 'combo-banner';
    banner.textContent = comboNumber + 'x COMBO!';
    popupLayer.appendChild(banner);
    setTimeout(()=> banner.remove(), 900);
  }

  // Drop existing fruits down into empty (null) slots, then fill the
  // remaining empty slots at the top with freshly spawned fruits.
  function applyGravityAndRefill(){
    for(let c=0;c<GRID_SIZE;c++){
      // collect surviving fruits bottom-up
      let stack = [];
      for(let r=GRID_SIZE-1;r>=0;r--){
        if(board[r][c] !== null) stack.push(board[r][c]);
      }
      const missing = GRID_SIZE - stack.length;
      const newColumn = [];
      // fill top with new fruits
      for(let i=0;i<missing;i++) newColumn.push(randomFruit());
      // then the surviving fruits (already bottom-to-top in `stack`, reverse to top-to-bottom)
      for(let i=stack.length-1;i>=0;i--) newColumn.push(stack[i]);

      for(let r=0;r<GRID_SIZE;r++){
        board[r][c] = newColumn[r];
      }
    }
    rebuildBoardVisualAfterCascade();
  }

  // Rebuild the DOM so that fruits appear to fall from above / spawn from
  // the top, based on the freshly computed `board` state.
  function rebuildBoardVisualAfterCascade(){
    // Remove old fruit elements entirely and rebuild, but animate:
    // simplest robust approach given cascades can be complex — rebuild
    // DOM fresh each pass, using 'spawn' animation for all cells changed.
    boardEl.querySelectorAll('.fruit').forEach(el=> el.remove());
    cellEls = [];
    for(let r=0;r<GRID_SIZE;r++){
      const rowEls = [];
      for(let c=0;c<GRID_SIZE;c++){
        const f = document.createElement('div');
        f.className = 'fruit spawn';
        f.textContent = board[r][c];
        positionFruit(f, r, c);
        f.dataset.row = r;
        f.dataset.col = c;
        f.addEventListener('click', onFruitClick);
        f.addEventListener('touchstart', onFruitTouch, {passive:true});
        boardEl.appendChild(f);
        rowEls.push(f);
      }
      cellEls.push(rowEls);
    }
  }

  /* ============================================================
     SCORING / MOVES / GAME OVER
  ============================================================ */
  function addScore(pts){
    score += pts;
    scoreEl.textContent = score;
    if(score > best){
      best = score;
      bestEl.textContent = best;
    }
  }

  function useMove(){
    moves -= 1;
    movesEl.textContent = Math.max(moves,0);
    movesStatEl.classList.toggle('low', moves<=5 && moves>0);
  }

  function checkNoMovesLeft(){
    if(moves<=0){
      endGame();
    }
  }

  function endGame(){
    busy = true;
    sfxGameOver();
    const isNewBest = score >= best;
    if(isNewBest){
      best = score;
      MemoryStore.set('fruitMatchBest', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = score;
    finalBestEl.textContent = best;
    newBestBadge.style.display = isNewBest ? 'inline-block' : 'none';
    overlay.classList.add('show');
  }

  /* ============================================================
     RESTART
  ============================================================ */
  function restartGame(){
    score = 0;
    moves = START_MOVES;
    selected = null;
    busy = false;
    scoreEl.textContent = '0';
    movesEl.textContent = String(START_MOVES);
    movesStatEl.classList.remove('low');
    bestEl.textContent = best;
    overlay.classList.remove('show');
    board = createBoard();
    buildCellsDOM();
  }

  restartBtn.addEventListener('click', restartGame);

  /* ============================================================
     INIT
  ============================================================ */
  function init(){
    buildAmbient();
    bestEl.textContent = best;
    board = createBoard();
    buildCellsDOM();
  }

  init();
})();
</script>
</body>
